name = "sas-outlet-api"
main = "src/index.js"
compatibility_date = "2026-07-02"

# Nightly lifecycle sweep (expire reservations, ignore >2000 kr, withdraw >10 days)
[triggers]
crons = ["0 3 * * *"]

# Shared D1 database — same database as the sas-outlet-web Next.js Worker.
# Schema/migrations live in sas-outlet/migrations/.
[[d1_databases]]
binding = "DB"
database_name = "sas-outlet-db"
database_id = "270f9eab-09f9-498b-83d6-0012d9d1fc4e" # created 2026-07-02, stadsauktionsundsvall account, EEUR

# Item images (public bucket; served via PUBLIC_IMAGES_BASE)
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "sas-outlet-images"

[vars]
# Public base URL of the sas-outlet-images bucket (r2.dev dev-url; swap for a
# custom domain like images.stadsauktionsundsvall.se later if desired)
PUBLIC_IMAGES_BASE = "https://pub-c66204f3f0404bb7a66e3214313d2030.r2.dev"

# Secret (set with `wrangler secret put OUTLET_API_TOKEN`):
#   OUTLET_API_TOKEN — bearer token the extension sends on every write

[observability]
enabled = true
